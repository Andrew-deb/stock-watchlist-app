<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Watchlist - Enhanced</title>
  <!-- Chart.js for interactive charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 32px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .header p {
      font-size: 16px;
      opacity: 0.9;
    }
    
    .content {
      padding: 32px;
    }
    
    .add-stock-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }
    
    .add-stock-section h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #667eea;
    }
    
    .form-group {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    
    .form-group input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #5a6268;
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
      padding: 6px 12px;
      font-size: 14px;
    }
    
    .btn-danger:hover {
      background: #c82333;
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      animation: slideIn 0.3s ease-out;
    }
    
    .alert-success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    
    .alert-error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    
    .watchlist-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .search-box:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .stat-card {
      flex: 1;
      min-width: 150px;
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .stat-label {
      font-size: 12px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }
    
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    
    thead {
      background: #f8f9fa;
    }
    
    th {
      padding: 16px;
      text-align: left;
      font-weight: 600;
      color: #495057;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    
    th:hover {
      background: #e9ecef;
    }
    
    th.sortable::after {
      content: '⇅';
      margin-left: 8px;
      opacity: 0.3;
    }
    
    th.sort-asc::after {
      content: '↑';
      opacity: 1;
      color: #667eea;
    }
    
    th.sort-desc::after {
      content: '↓';
      opacity: 1;
      color: #667eea;
    }
    
    td {
      padding: 16px;
      border-top: 1px solid #e0e0e0;
    }
    
    tr:hover {
      background: #f8f9fa;
    }
    
    .symbol-cell {
      font-weight: 600;
      color: #667eea;
      font-size: 16px;
    }
    
    .price-cell {
      font-weight: 600;
      font-size: 16px;
    }
    
    .price-positive {
      color: #28a745;
    }
    
    .price-negative {
      color: #dc3545;
    }
    
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }
    
    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }
    
    .modal.show {
      display: block;
    }
    
    .modal-content {
      background-color: white;
      margin: 5% auto;
      padding: 0;
      border-radius: 16px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .modal-header {
      padding: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 16px 16px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-header h2 {
      margin: 0;
      font-size: 24px;
    }
    
    .close {
      color: white;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }
    
    .close:hover {
      opacity: 0.7;
    }
    
    .modal-body {
      padding: 24px;
    }
    
    .chart-container {
      position: relative;
      height: 300px;
      margin-bottom: 24px;
    }
    
    /* Market Movers Styles */
    .market-movers {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }
    
    .market-movers h3 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #667eea;
    }
    
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .tab-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .tab-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }
    
    .movers-list {
      display: grid;
      gap: 8px;
    }
    
    .mover-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mover-item:hover {
      transform: translateX(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .mover-symbol {
      font-weight: 600;
      color: #667eea;
    }
    
    .mover-price {
      font-weight: 600;
    }
    
    .mover-change {
      font-size: 14px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
    }
    
    .mover-change.positive {
      color: #28a745;
      background: #d4edda;
    }
    
    .mover-change.negative {
      color: #dc3545;
      background: #f8d7da;
    }
    
    @media (max-width: 768px) {
      .content {
        padding: 20px;
      }
      
      .form-group {
        flex-direction: column;
      }
      
      .form-group input,
      .btn {
        width: 100%;
      }
      
      .watchlist-controls {
        flex-direction: column;
      }
      
      .search-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📈 Stock Watchlist</h1>
      <p>Track your favorite stocks in real-time</p>
    </div>
    
    <div class="content">
      <div class="add-stock-section">
        <h2>Add Stock to Watchlist</h2>
        <form id="stock-form">
          <div class="form-group">
            <input 
              type="text" 
              id="symbol" 
              name="symbol" 
              placeholder="Enter ticker symbol (e.g., AAPL, GOOGL, MSFT)" 
              required
              pattern="[A-Z]{1,10}(\.[A-Z]{1,2})?"
              title="Enter a valid stock ticker symbol"
            >
            <button type="submit" class="btn btn-primary" id="add-btn">
              <span>Add to Watchlist</span>
            </button>
          </div>
        </form>
      </div>

      <div id="alert-container"></div>

      <!-- Market Movers Section -->
      <div class="market-movers">
        <h3>📊 Market Movers</h3>
        <div class="tabs">
          <button class="tab-btn active" id="gainers-tab" onclick="showGainers()">Top Gainers</button>
          <button class="tab-btn" id="losers-tab" onclick="showLosers()">Top Losers</button>
        </div>
        <div id="movers-list" class="movers-list">
          <div style="text-align: center; padding: 20px; color: #6c757d;">
            <div class="loading"></div>
            <p>Loading market movers...</p>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total Stocks</div>
          <div class="stat-value" id="total-stocks">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Value</div>
          <div class="stat-value" id="total-value">$0.00</div>
        </div>
      </div>

      <div class="watchlist-controls">
        <input 
          type="text" 
          id="search" 
          class="search-box" 
          placeholder="🔍 Search stocks..."
        >
        <button class="btn btn-secondary" id="refresh-btn">
          <span>🔄 Refresh All</span>
        </button>
      </div>

      <div class="table-container">
        <table id="watchlist-table">
          <thead>
            <tr>
              <th class="sortable" data-sort="symbol">Symbol</th>
              <th class="sortable" data-sort="price">Latest Price</th>
              <th class="sortable" data-sort="updated">Last Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="watchlist-body">
            <tr>
              <td colspan="4" class="empty-state">
                <div class="loading"></div>
                <p>Loading watchlist...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Stock Detail Modal -->
  <div id="stock-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-symbol">AAPL</h2>
        <span class="close" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-body">
        <div class="chart-container">
          <canvas id="price-chart"></canvas>
        </div>
        <div id="modal-details"></div>
      </div>
    </div>
  </div>

  <script>
    let watchlistData = [];
    let sortColumn = 'symbol';
    let sortDirection = 'asc';
    let searchTerm = '';

    // Alert system
    function showAlert(message, type = 'success') {
      const alertContainer = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);
      
      setTimeout(() => {
        alert.style.animation = 'slideIn 0.3s ease-out reverse';
        setTimeout(() => alert.remove(), 300);
      }, 5000);
    }

    // Load watchlist
    async function loadWatchlist() {
      try {
        const resp = await fetch('/watchlist');
        const data = await resp.json();
        
        if (!resp.ok) {
          throw new Error(data.error || resp.statusText);
        }
        
        watchlistData = data;
        renderWatchlist();
        updateStats();
      } catch (err) {
        showAlert('Failed to load watchlist: ' + err.message, 'error');
        renderEmptyState('Error loading data');
      }
    }

    // Render watchlist
    function renderWatchlist() {
      const tbody = document.getElementById('watchlist-body');
      
      // Filter data
      let filteredData = watchlistData.filter(row => 
        row.symbol.toLowerCase().includes(searchTerm.toLowerCase())
      );
      
      // Sort data
      filteredData.sort((a, b) => {
        let aVal = a[sortColumn];
        let bVal = b[sortColumn];
        
        if (sortColumn === 'price') {
          aVal = parseFloat(aVal) || 0;
          bVal = parseFloat(bVal) || 0;
        }
        
        if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
        if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
        return 0;
      });
      
      if (filteredData.length === 0) {
        renderEmptyState(searchTerm ? 'No stocks match your search' : 'Your watchlist is empty');
        return;
      }
      
      tbody.innerHTML = filteredData.map(row => {
        const price = row.latest_price !== null && row.latest_price !== undefined
          ? Number(row.latest_price).toFixed(2)
          : '-';
        const updated = row.updated_at 
          ? new Date(row.updated_at).toLocaleString()
          : '-';
        
        return `
          <tr>
            <td class="symbol-cell" style="cursor: pointer;" onclick="openStockModal('${row.symbol}')">${row.symbol}</td>
            <td class="price-cell">${price}</td>
            <td>${updated}</td>
            <td>
              <button class="btn btn-danger" onclick="deleteStock('${row.symbol}'); event.stopPropagation();">
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Render empty state
    function renderEmptyState(message) {
      const tbody = document.getElementById('watchlist-body');
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="empty-state">
            <svg fill="currentColor" viewBox="0 0 20 20">
              <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
              <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
            </svg>
            <p>${message}</p>
          </td>
        </tr>
      `;
    }

    // Update statistics
    function updateStats() {
      document.getElementById('total-stocks').textContent = watchlistData.length;
      
      const totalValue = watchlistData.reduce((sum, row) => {
        const price = parseFloat(row.latest_price) || 0;
        return sum + price;
      }, 0);
      
      document.getElementById('total-value').textContent = '$' + totalValue.toFixed(2);
    }

    // Delete stock
    window.deleteStock = async function(symbol) {
      if (!confirm(`Are you sure you want to remove ${symbol} from your watchlist?`)) {
        return;
      }
      
      try {
        const resp = await fetch('/watchlist/' + symbol, {
          method: 'DELETE'
        });
        
        const data = await resp.json();
        
        if (!resp.ok) {
          throw new Error(data.error || resp.statusText);
        }
        
        showAlert(`Successfully removed ${symbol} from watchlist`, 'success');
        loadWatchlist();
      } catch (err) {
        showAlert('Failed to delete stock: ' + err.message, 'error');
      }
    };

    // Add stock form handler
    document.getElementById('stock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const input = document.getElementById('symbol');
      const symbol = input.value.trim().toUpperCase();
      const btn = document.getElementById('add-btn');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span><span>Adding...</span>';
      
      try {
        const resp = await fetch('/watchlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ symbol })
        });
        
        const data = await resp.json();
        
        if (!resp.ok) {
          throw new Error(data.error || resp.statusText);
        }
        
        showAlert(`Successfully added ${data.symbol} at $${data.latest_price}`, 'success');
        input.value = '';
        loadWatchlist();
      } catch (err) {
        showAlert('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Add to Watchlist</span>';
      }
    });

    // Search handler
    document.getElementById('search').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderWatchlist();
    });

    // Refresh button
    document.getElementById('refresh-btn').addEventListener('click', () => {
      loadWatchlist();
      showAlert('Watchlist refreshed', 'success');
    });

    // Sort handlers
    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const newColumn = th.dataset.sort;
        
        if (sortColumn === newColumn) {
          sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          sortColumn = newColumn;
          sortDirection = 'asc';
        }
        
        // Update visual indicators
        document.querySelectorAll('th.sortable').forEach(h => {
          h.classList.remove('sort-asc', 'sort-desc');
        });
        th.classList.add('sort-' + sortDirection);
        
        renderWatchlist();
      });
    });

    // ========== MARKET MOVERS FUNCTIONALITY ==========
    let currentMoverType = 'gainers';

    async function loadMarketMovers(type = 'gainers') {
      try {
        const endpoint = type === 'gainers' ? '/api/movers/gainers' : '/api/movers/losers';
        const resp = await fetch(endpoint + '?limit=10');
        const data = await resp.json();
        
        if (!resp.ok) {
          throw new Error(data.error || resp.statusText);
        }
        
        renderMarketMovers(data.movers || []);
      } catch (err) {
        console.error('Failed to load market movers:', err);
        document.getElementById('movers-list').innerHTML = `
          <div style="text-align: center; padding: 20px; color: #dc3545;">
            <p>Failed to load market movers</p>
          </div>
        `;
      }
    }

    function renderMarketMovers(movers) {
      const container = document.getElementById('movers-list');
      
      if (!movers || movers.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 20px; color: #6c757d;">No data available</div>';
        return;
      }
      
      container.innerHTML = movers.map(mover => {
        const changeClass = mover.change_percent >= 0 ? 'positive' : 'negative';
        const changeSymbol = mover.change_percent >= 0 ? '↑' : '↓';
        const price = mover.current_price ? '$' + Number(mover.current_price).toFixed(2) : '-';
        const changePercent = mover.change_percent ? Number(mover.change_percent).toFixed(2) + '%' : '-';
        
        return `
          <div class="mover-item" onclick="openStockModal('${mover.symbol}')">
            <span class="mover-symbol">${mover.symbol}</span>
            <span class="mover-price">${price}</span>
            <span class="mover-change ${changeClass}">${changeSymbol} ${changePercent}</span>
          </div>
        `;
      }).join('');
    }

    function showGainers() {
      currentMoverType = 'gainers';
      document.getElementById('gainers-tab').classList.add('active');
      document.getElementById('losers-tab').classList.remove('active');
      loadMarketMovers('gainers');
    }

    function showLosers() {
      currentMoverType = 'losers';
      document.getElementById('losers-tab').classList.add('active');
      document.getElementById('gainers-tab').classList.remove('active');
      loadMarketMovers('losers');
    }

    // ========== STOCK MODAL & CHART FUNCTIONALITY ==========
    let currentChart = null;

    async function openStockModal(symbol) {
      const modal = document.getElementById('stock-modal');
      document.getElementById('modal-symbol').textContent = symbol;
      modal.classList.add('show');
      
      // Load chart data
      await loadStockChart(symbol);
    }

    function closeModal() {
      const modal = document.getElementById('stock-modal');
      modal.classList.remove('show');
      
      // Destroy chart to free memory
      if (currentChart) {
        currentChart.destroy();
        currentChart = null;
      }
    }

    async function loadStockChart(symbol) {
      try {
        const resp = await fetch(`/api/historical/${symbol}?days=30`);
        const data = await resp.json();
        
        if (!resp.ok || !data.labels || data.labels.length === 0) {
          document.getElementById('modal-details').innerHTML = '<p style="color: #dc3545;">No chart data available</p>';
          return;
        }
        
        // Destroy previous chart
        if (currentChart) {
          currentChart.destroy();
        }
        
        // Create new chart
        const ctx = document.getElementById('price-chart').getContext('2d');
        currentChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.labels,
            datasets: data.datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: 'top'
              },
              tooltip: {
                mode: 'index',
                intersect: false
              }
            },
            scales: {
              y: {
                beginAtZero: false,
                ticks: {
                  callback: function(value) {
                    return '$' + value.toFixed(2);
                  }
                }
              }
            }
          }
        });
      } catch (err) {
        console.error('Failed to load chart:', err);
        document.getElementById('modal-details').innerHTML = '<p style="color: #dc3545;">Failed to load chart data</p>';
      }
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('stock-modal');
      if (event.target === modal) {
        closeModal();
      }
    };

    // Initialize
    loadWatchlist();
    loadMarketMovers('gainers');
  </script>
</body>
</html>
